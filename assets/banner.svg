<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="45%" stop-color="#0b172e" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Beacon Gradient -->
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.18)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.18)" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Glow Filter -->
    <filter id="glowIntense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -1.2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 23px; fill: #38bdf8; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .header-pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; fill: #38bdf8; letter-spacing: 1.2px; }
    .node-label { font-family: monospace; font-size: 10px; fill: #64748b; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Top Decorative Gradient Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Decorative Right Network Topology Mesh -->
  <g opacity="0.18">
    <!-- Grid & Mesh Lines -->
    <line x1="840" y1="45" x2="1140" y2="45" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1140" y1="45" x2="1140" y2="315" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="840" y1="315" x2="1140" y2="315" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="840" y1="45" x2="840" y2="315" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Dynamic Topology Nodes & Edges -->
    <path d="M890 100 L970 65 L1060 110 L1110 80 L1080 180 L1010 160 L930 220 L870 170 Z" fill="none" stroke="#0ea5e9" stroke-width="1.5" />
    <line x1="970" y1="65" x2="1010" y2="160" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="1060" y1="110" x2="930" y2="220" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="930" y1="220" x2="1030" y2="270" stroke="#10b981" stroke-width="1.5" />
    <line x1="1080" y1="180" x2="1030" y2="270" stroke="#10b981" stroke-width="1.5" />
    <line x1="1030" y1="270" x2="1120" y2="250" stroke="#10b981" stroke-width="1.2" />

    <!-- Node circles with latency ping markers -->
    <circle cx="890" cy="100" r="4" fill="#38bdf8" />
    <circle cx="970" cy="65" r="5" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="1060" cy="110" r="4.5" fill="#38bdf8" />
    <circle cx="1110" cy="80" r="4" fill="#38bdf8" />
    <circle cx="1080" cy="180" r="4.5" fill="#3b82f6" />
    <circle cx="1010" cy="160" r="6" fill="#60a5fa" filter="url(#glow)" />
    <circle cx="930" cy="220" r="5" fill="#38bdf8" />
    <circle cx="870" cy="170" r="4" fill="#38bdf8" />
    <circle cx="1030" cy="270" r="5.5" fill="#10b981" filter="url(#glow)" />
    <circle cx="1120" cy="250" r="4" fill="#10b981" />

    <!-- Waveform background traces -->
    <path d="M840 200 Q890 170 940 200 T1040 200 T1140 200" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Left Hero Icon Graphic: Network Radar & Telemetry Wave -->
  <g transform="translate(80, 75)">
    <!-- Deep Ring Container -->
    <circle cx="70" cy="70" r="66" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" opacity="0.9" />
    <circle cx="70" cy="70" r="76" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />

    <!-- Concentric Wi-Fi / Radar Wave Arcs -->
    <path d="M42 46 A 40 40 0 0 1 98 46" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.35" />
    <path d="M49 57 A 30 30 0 0 1 91 57" fill="none" stroke="#00f2fe" stroke-width="3.2" stroke-linecap="round" opacity="0.7" filter="url(#glow)" />
    <path d="M57 68 A 18 18 0 0 1 83 68" fill="none" stroke="#38ef7d" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />

    <!-- Center Transmitter Beacon Node -->
    <circle cx="70" cy="80" r="5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="70" cy="80" r="10" fill="none" stroke="#38ef7d" stroke-width="1.5" opacity="0.8" />

    <!-- Real-time Oscilloscope / Ping RTT Latency Waveform -->
    <g transform="translate(25, 95)">
      <!-- Wave background bar -->
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1" opacity="0.9" />
      <!-- Sharp latency spike then stabilization (1ms evidence) -->
      <path d="M6 14 H24 L30 5 L36 21 L42 9 L48 16 L54 13 L84 13" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
      <circle cx="84" cy="13" r="2.5" fill="#10b981" />
    </g>
  </g>

  <!-- Main Content Block -->
  <g transform="translate(265, 58)">
    <!-- Header Top Pill -->
    <g transform="translate(0, 0)">
      <rect width="365" height="28" rx="14" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="14" r="4.5" fill="#10b981" />
      <text x="30" y="18.5" class="header-pill">WINDOWS 10 / 11 / 24H2 • READ-ONLY TELEMETRY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" class="title">NETWORK SLOW DIAGNOSIS</text>

    <!-- Subtitle -->
    <text x="0" y="114" class="subtitle">Windows 本机网络变慢 &amp; 间歇性卡顿分层诊断排查</text>

    <!-- Tagline -->
    <text x="0" y="146" class="tagline">Production-Grade L0~L5 Telemetry &amp; Root Cause Pinpointing with Hard Evidence</text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 182)">
      <!-- Pill 1: 一键全自动诊断 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">⚡ 一键诊断 (diagnose.ps1)</text>
      </g>
      <!-- Pill 2: Wi-Fi 7 / 同频拥塞 -->
      <g transform="translate(170, 0)">
        <rect width="156" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">📶 Wi-Fi 7 / 同频拥塞</text>
      </g>
      <!-- Pill 3: DoH / DNS 后缀 -->
      <g transform="translate(336, 0)">
        <rect width="146" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">🔒 DoH / DNS 后缀</text>
      </g>
      <!-- Pill 4: TIME_WAIT / 双栈 -->
      <g transform="translate(492, 0)">
        <rect width="156" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">⏱️ TIME_WAIT / 双栈</text>
      </g>
      <!-- Pill 5: 100% 纯只读安全 -->
      <g transform="translate(658, 0)">
        <rect width="146" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">🛡️ 100% 纯只读安全</text>
      </g>
    </g>
  </g>
</svg>
